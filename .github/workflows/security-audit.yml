name: Függőségek biztonsági ellenőrzése

# Weekly and on demand, so a newly published advisory shows up without blocking unrelated pull requests.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-dev.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --audit-level=moderate
