name: Tesztek

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m py_compile app.py analytics.py storage.py garmin_sync.py garmin_profile.py benchmarks.py tips.py assistant.py assistant_context.py assistant_prompts.py auth_store.py data_export.py garmin_connection.py model_registry.py
      - name: Vercel functions import with production dependencies only
        run: |
          python -m venv /tmp/prod && /tmp/prod/bin/pip install -q -r requirements.txt
          /tmp/prod/bin/python -c "import api.admin, api.assistant, api.auth, api.dashboard, api.sessions, api.garmin, api.model, api.retrain, api.state, api.sync"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:navigation
